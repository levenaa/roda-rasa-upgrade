
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin | Roda Rasa</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      background: #fff8ef;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.08);
    }

    .login-card h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .login-card > p {
      color: #77716c;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .login-card label {
      display: block;
      font-weight: 700;
      font-size: 13px;
      margin: 15px 0 7px;
    }

    .login-card input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #e5ded7;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .login-card input:focus {
      border-color: #e87532;
    }

    .login-card button {
      width: 100%;
      margin-top: 23px;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: #e87532;
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .login-card button:hover {
      background: #c95b20;
    }

    #pesan-login {
      margin-top: 15px;
      font-size: 13px;
      color: #c0392b;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #e87532;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="login-page">
    <div class="login-card">
      <a href="index.html" class="logo">Roda<span>Rasa.</span></a>

      <h1>Login Admin</h1>
      <p>Masuk untuk mengelola website Roda Rasa.</p>

      <form id="form-login">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Masukkan email admin"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
          required
        >

        <button type="submit" id="tombol-login">
          Masuk ke Dashboard
        </button>
      </form>

      <p id="pesan-login" role="status"></p>

      <a href="index.html" class="back-home">← Kembali ke Beranda</a>
    </div>
  </main>

  <script type="module">
    import { supabase } from "./js/supabase.js";

    const form = document.getElementById("form-login");
    const pesan = document.getElementById("pesan-login");
    const tombol = document.getElementById("tombol-login");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      pesan.textContent = "";
      tombol.disabled = true;
      tombol.textContent = "Sedang masuk...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        pesan.textContent = "Login gagal: " + error.message;
        tombol.disabled = false;
        tombol.textContent = "Masuk ke Dashboard";
        return;
      }

      if (data.user.id !== "baa53276-888b-4f0b-8594-51fc192a6f28") {
        await supabase.auth.signOut();
        pesan.textContent = "Akun ini tidak memiliki akses admin.";
        tombol.disabled = false;
        tombol.textContent = "Masuk ke Dashboard";
        return;
      }

      window.location.href = "admin.html";
    });
  </script>
</body>
</html>
